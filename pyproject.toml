[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlfit"
version = "1.1.1"
authors = [
  { name="Kui Xie" }
]
description = "ctrlfit is a jax-sysid-based library for training recurrent output-feedback surrogate controllers from trajectories generated by an expert controller-observer pair."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "jax",
  "jax-sysid",
  "joblib",
  "matplotlib",
  "jaxopt",
  "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["surrogate control", "observer", "jax-sysid", "RNN", "Lyapunov"]

[project.urls]
"Homepage" = "https://github.com/QuinnXie/CtrlFit.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
testpaths = ["tests"]
